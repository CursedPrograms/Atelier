<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Diorama: a little world in a glass box: grass, a mountain, a tree, a lighthouse, water, and the axes -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c3a3a"/><stop offset="1" stop-color="#0f2226"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ad8a8"/><stop offset="1" stop-color="#1a9a8a"/></linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ad870"/><stop offset="1" stop-color="#3e9a5a"/></linearGradient>
    <linearGradient id="soilL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5a3a"/><stop offset="1" stop-color="#5a3a26"/></linearGradient>
    <linearGradient id="soilR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a87048"/><stop offset="1" stop-color="#6a4a30"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ab0e0"/><stop offset="1" stop-color="#2a80c8"/></linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6e6ea"/><stop offset="0.5" stop-color="#a8a8b4"/><stop offset="1" stop-color="#6a6a78"/></linearGradient>
  </defs>
  <rect x="10" y="10" width="492" height="492" rx="96" fill="url(#bg)" stroke="url(#rim)" stroke-width="12"/>
  <!-- the glass box: back edges -->
  <g fill="none" stroke="#9ae8e0" stroke-width="2.5" opacity="0.55">
    <path d="M86 240 L86 112 L256 56 L426 112 L426 240"/>
    <path d="M256 56 L256 180"/>
  </g>
  <!-- the block: two sides of soil with a stripe of water, the grass on top -->
  <path d="M86 244 L256 300 L256 420 L86 360 Z" fill="url(#soilL)"/>
  <path d="M256 300 L426 244 L426 360 L256 420 Z" fill="url(#soilR)"/>
  <path d="M256 330 L426 274 L426 300 L256 356 Z" fill="url(#water)" opacity="0.9"/>
  <path d="M86 244 L256 188 L426 244 L256 300 Z" fill="url(#grass)"/>
  <!-- the river across the grass -->
  <path d="M300 286 C320 262 360 256 400 252 L426 244 L408 262 C372 268 340 276 322 292 Z" fill="url(#water)"/>
  <!-- the mountain -->
  <path d="M200 252 L262 98 L332 256 Z" fill="url(#rock)"/>
  <path d="M262 98 L240 154 L262 146 L282 162 Z" fill="#fafafc"/>
  <path d="M262 98 L332 256 L296 260 Z" fill="#5e5e6c" opacity="0.6"/>
  <!-- the tree -->
  <rect x="140" y="216" width="10" height="34" fill="#6a4a2a"/>
  <circle cx="146" cy="196" r="30" fill="#4ab85a"/>
  <circle cx="136" cy="188" r="16" fill="#6ad070"/>
  <!-- the lighthouse, with its light -->
  <circle cx="370" cy="160" r="26" fill="#ffb84a" opacity="0.35"/>
  <path d="M360 236 L364 176 L376 176 L380 236 Z" fill="#f4f4f6"/>
  <path d="M361 220 L379 220 L380 236 L360 236 Z M362 196 L378 196 L379 208 L361 208 Z" fill="#e04a4a"/>
  <rect x="362" y="164" width="16" height="12" fill="#ffd060"/>
  <path d="M360 164 L370 150 L380 164 Z" fill="#e04a4a"/>
  <!-- the glass box: front edges -->
  <g fill="none" stroke="#c8fff6" stroke-width="3" opacity="0.8">
    <path d="M86 112 L86 360 L256 420 L426 360 L426 112"/>
    <path d="M86 112 L256 168 L426 112"/>
    <path d="M256 168 L256 420"/>
  </g>
  <!-- the axes, under the box -->
  <g stroke-width="5" stroke-linecap="round">
    <line x1="160" y1="444" x2="160" y2="402" stroke="#5ad86a"/>
    <line x1="352" y1="444" x2="352" y2="402" stroke="#5aa8e8"/>
    <line x1="336" y1="458" x2="380" y2="470" stroke="#e85a4a"/>
  </g>
  <g><circle cx="160" cy="398" r="6" fill="#5ad86a"/><circle cx="352" cy="398" r="6" fill="#5aa8e8"/><circle cx="384" cy="471" r="6" fill="#e85a4a"/></g>
</svg>
