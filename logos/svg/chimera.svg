<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Chimera: layered sheets (the layers), a low-poly lion (the chimera), a pen nib, a brush, a Bezier curve -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e1634"/><stop offset="1" stop-color="#1a0d20"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e862dc"/><stop offset="0.5" stop-color="#9a44d4"/><stop offset="1" stop-color="#e05ad4"/></linearGradient>
    <linearGradient id="s1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f27ad0"/><stop offset="1" stop-color="#c24cbc"/></linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d266d4"/><stop offset="1" stop-color="#9a4cc8"/></linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9c66dc"/><stop offset="1" stop-color="#6a5ad4"/></linearGradient>
    <linearGradient id="s4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ad6f4"/><stop offset="1" stop-color="#3e8ee0"/></linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9a9aac"/></linearGradient>
  </defs>
  <rect x="10" y="10" width="492" height="492" rx="96" fill="url(#bg)" stroke="url(#rim)" stroke-width="12"/>
  <!-- the sheets: four layers, stacked down to the left, see-through -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="2">
    <path d="M52 352 L214 286 L364 334 L202 400 Z" fill="url(#s4)" fill-opacity="0.9"/>
    <path d="M52 304 L214 238 L364 286 L202 352 Z" fill="url(#s3)" fill-opacity="0.82"/>
    <path d="M52 256 L214 190 L364 238 L202 304 Z" fill="url(#s2)" fill-opacity="0.82"/>
    <path d="M52 208 L214 142 L364 190 L202 256 Z" fill="url(#s1)" fill-opacity="0.88"/>
  </g>
  <!-- the lion: low-poly facets, its mane spiking back over the sheets, looking right -->
  <g stroke="#ffd0f4" stroke-opacity="0.55" stroke-width="1.5" stroke-linejoin="round">
    <path d="M312 130 L250 98 L300 180 Z" fill="#9446c4"/>
    <path d="M300 180 L234 146 L268 208 Z" fill="#a24ecc"/>
    <path d="M268 208 L206 200 L298 242 Z" fill="#8a40bc"/>
    <path d="M298 242 L216 256 L320 292 Z" fill="#9a4ac6"/>
    <path d="M320 292 L244 306 L318 322 Z" fill="#8440b8"/>
    <path d="M318 322 L276 352 L346 330 Z" fill="#7a3cb0"/>
    <path d="M300 180 L268 208 L298 242 Z" fill="#b25ad2"/>
    <path d="M312 130 L318 94 L346 138 Z" fill="#c06ad8"/>
    <path d="M312 130 L346 138 L340 190 L300 180 Z" fill="#d07ede"/>
    <path d="M346 138 L392 190 L340 190 Z" fill="#e696e8"/>
    <path d="M340 190 L392 190 L380 230 L352 240 Z" fill="#d684e2"/>
    <path d="M392 190 L432 234 L380 230 Z" fill="#f2b0f0"/>
    <path d="M380 230 L432 234 L424 258 L398 266 Z" fill="#e8a0ec"/>
    <path d="M352 240 L380 230 L398 266 L370 278 Z" fill="#c672dc"/>
    <path d="M370 278 L398 266 L390 294 L352 302 Z" fill="#b462d4"/>
    <path d="M300 180 L340 190 L352 240 L298 242 Z" fill="#bc66d6"/>
    <path d="M298 242 L352 240 L370 278 L320 292 Z" fill="#a856ce"/>
    <path d="M320 292 L370 278 L352 302 L318 322 Z" fill="#9a4ec8"/>
  </g>
  <path d="M362 204 L378 200 L374 210 Z" fill="#2a0f30"/>
  <path d="M424 258 L432 234 L440 244 Z" fill="#5a2060"/>
  <!-- the pen nib, up to the right -->
  <g transform="rotate(34 376 92)">
    <rect x="364" y="22" width="24" height="60" rx="6" fill="#dcdce6"/>
    <path d="M360 82 L392 82 L376 144 Z" fill="url(#nib)" stroke="#6a6a7a" stroke-width="2"/>
    <line x1="376" y1="92" x2="376" y2="134" stroke="#5a5a6a" stroke-width="3"/>
    <circle cx="376" cy="98" r="4.5" fill="#5a5a6a"/>
  </g>
  <!-- the brush, down to the left -->
  <g transform="rotate(-46 104 430)">
    <rect x="96" y="290" width="18" height="118" rx="8" fill="#ececf2"/>
    <rect x="94" y="402" width="22" height="20" rx="2" fill="#b4b4c4"/>
    <path d="M94 422 Q105 474 105 488 Q105 474 116 422 Z" fill="#e66cc4"/>
  </g>
  <!-- a Bezier curve with its handles -->
  <g fill="none" stroke="#f4f4f8" stroke-linecap="round">
    <path d="M326 440 C346 384 410 384 434 414" stroke-width="3.5"/>
    <line x1="346" y1="384" x2="326" y2="440" stroke-width="2" opacity="0.7"/>
    <line x1="410" y1="384" x2="434" y2="414" stroke-width="2" opacity="0.7"/>
  </g>
  <g fill="#f4f4f8"><circle cx="326" cy="440" r="7"/><circle cx="434" cy="414" r="7"/><circle cx="346" cy="384" r="5"/><circle cx="410" cy="384" r="5"/></g>
</svg>
